name: Build LOL Assistants APK

on:
  workflow_dispatch:
  push:
    branches:
      - v2-native-ui
    paths:
      - 'native-app/**'
      - '.github/workflows/bootstrap-build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          set -euo pipefail
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          test -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          sdkmanager --version
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Validate native project
        working-directory: native-app
        run: |
          set -euo pipefail
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/wildriftmetalite/MainActivity.java
          test -f app/src/main/java/com/wildriftmetalite/OfflineDataRepository.java
          test -f app/src/main/assets/data/data_manifest.json
          test -f app/src/main/assets/data/champions.json
          test -f app/src/main/assets/data/items.json
          test -f app/src/main/assets/data/runes.json
          test -f app/src/main/assets/data/rune_recommendations.json
          test -f app/src/main/assets/data/matchups.json
          test -f app/src/main/assets/data/team_rules.json
          test -f app/src/main/assets/data/macro_rules.json

          ROOT_NAME=$(sed -n "s/^rootProject\.name[[:space:]]*=[[:space:]]*['\"]\(.*\)['\"][[:space:]]*$/\1/p" settings.gradle)
          test "$ROOT_NAME" = "LOL-Assistants"
          if printf '%s' "$ROOT_NAME" | grep -qE '[:/\\<>"?*|]'; then
            echo 'ERROR: Invalid character detected in Gradle rootProject.name.'
            exit 1
          fi

          grep -q "com.android.application" build.gradle
          grep -q "applicationId 'com.wildriftmetalite'" app/build.gradle
          grep -q 'android:label="LOL: Assistants"' app/src/main/AndroidManifest.xml
          grep -q "LOL: Assistants" app/src/main/res/values/strings.xml
          grep -q "MainActivity" app/src/main/AndroidManifest.xml
          grep -q "org.json" app/src/main/java/com/wildriftmetalite/OfflineDataRepository.java

          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('app/src/main/assets/data')
          manifest = json.loads((root / 'data_manifest.json').read_text())
          assert manifest['patch'] == '7.2e-reference'
          assert manifest['coverage'] == 'reference-subset'
          assert manifest['completeness']['champions'] != 'complete'
          assert manifest['completeness']['items'] != 'complete'

          expected_files = {
              'champions.json', 'items.json', 'runes.json', 'rune_recommendations.json',
              'matchups.json', 'team_rules.json', 'macro_rules.json'
          }
          assert set(manifest['files']) == expected_files

          for name in manifest['files']:
              path = root / name
              obj = json.loads(path.read_text())
              assert obj['patch'] == manifest['patch'], name
              assert obj['updatedAt'] == manifest['updatedAt'], name

              records = obj.get('champions') or obj.get('items') or obj.get('runes') \
                        or obj.get('recommendations') or obj.get('matchups') or obj.get('rules') or obj.get('macroRules')
              if records is not None:
                  assert isinstance(records, list), name
                  ids = []
                  for record in records:
                      assert isinstance(record, dict), name
                      if 'id' in record:
                          assert str(record['id']).strip(), name
                          ids.append(str(record['id']).strip())
                  assert len(ids) == len(set(ids)), f'duplicate id in {name}'

          placeholders = {
              'placeholder', 'dummy', 'test item', 'test rune',
              "amumu's counterweight", 'anti-burst defensive rune', 'cc mitigation rune'
          }
          for path in root.glob('*.json'):
              text = path.read_text().lower()
              for marker in placeholders:
                  assert marker not in text, f'placeholder marker {marker!r} in {path.name}'

          champions = json.loads((root / 'champions.json').read_text())['champions']
          items = json.loads((root / 'items.json').read_text())['items']
          recommendations = json.loads((root / 'rune_recommendations.json').read_text())['recommendations']
          assert len(champions) >= 20
          assert len(items) >= 11
          assert len(recommendations) >= 1
          print(f'Structured offline data validation: PASS ({len(champions)} champions, {len(items)} items, {len(recommendations)} rune presets)')
          PY

          if grep -RqsE 'android\.webkit\.WebView|[[:space:]]WebView[[:space:]]+[A-Za-z_][A-Za-z0-9_]*' app/src/main --include='*.java' --include='*.kt'; then
            echo 'ERROR: WebView API usage detected in native app source.'
            exit 1
          fi

      - name: Build APK
        working-directory: native-app
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Verify APK output
        run: |
          set -euo pipefail
          test -s native-app/app/build/outputs/apk/debug/app-debug.apk
          ls -lh native-app/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LOL-Assistants-debug
          path: native-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
