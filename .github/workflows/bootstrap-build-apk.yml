name: Build Native APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'native-app/**'
      - '.github/workflows/bootstrap-build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Validate native project
        working-directory: native-app
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/wildriftmetalite/MainActivity.java
      - name: Build APK
        working-directory: native-app
        run: gradle assembleDebug --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: WildRiftMetaLite-debug
          path: native-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
